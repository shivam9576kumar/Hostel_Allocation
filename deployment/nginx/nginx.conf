# /etc/nginx/nginx.conf (Snippet for IITP Nginx + ModSecurity WAF)
load_module modules/ngx_http_modsecurity_module.so; # Load ModSecurity

http {
    server {
        listen 443 ssl http2;
        server_name hostel.iitp.ac.in;

        # WAF Configuration
        modsecurity on;
        modsecurity_rules_file /etc/nginx/modsecurity/main.conf; # OWASP CRS Rules

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        location /api/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_buffering off;
        }

        location / {
            root /var/www/hostel-frontend/dist;
            try_files $uri /index.html;
        }
    }
}
