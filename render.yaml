services:
  - type: postgres
    name: hostel-db
    plan: starter
  - type: redis
    name: hostel-redis
    plan: starter
  - type: web
    name: hostel-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: hostel-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: hostel-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
  - type: static
    name: hostel-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          name: hostel-backend
          type: web
          property: host
  - type: worker
    name: hostel-pdf-worker
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/workers/pdfWorker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hostel-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: hostel-redis
          type: redis
          property: connectionString