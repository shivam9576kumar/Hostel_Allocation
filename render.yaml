services:
  # ==================== 1. POSTGRESQL DATABASE ====================
  - type: postgresql
    name: hostel-db
    plan: starter  # Change to "free" if you are on the free tier, but note free DB expires after 90 days

  # ==================== 2. REDIS CACHE/QUEUE ====================
  - type: redis
    name: hostel-redis
    plan: starter  # Free tier available, check Render pricing

  # ==================== 3. BACKEND API ====================
  - type: web
    name: hostel-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: hostel-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: hostel-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a strong secret
      - key: CORS_ORIGIN
        fromService:
          name: hostel-frontend
          type: static
          property: host  # Automatically allows your frontend URL

  # ==================== 4. FRONTEND STATIC SITE ====================
  - type: static
    name: hostel-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist  # If you use Vite. If Create-React-App, use "build"
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          name: hostel-backend
          type: web
          property: host  # Injects the backend URL like https://hostel-backend.onrender.com

  # ==================== 5. PDF BACKGROUND WORKER ====================
  - type: worker
    name: hostel-pdf-worker
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/workers/pdfWorker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hostel-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: hostel-redis
          type: redis
          property: connectionString
